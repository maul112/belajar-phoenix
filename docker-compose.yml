services:
  # === Aplikasi Phoenix ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upa_tik_portal
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.production
    environment:
      - PHX_SERVER=true
      - MIX_ENV=prod
      - DATABASE_URL=ecto://postgres:${DB_PASSWORD:-postgres}@db:5432/${DB_DATABASE:-upa_tik_portal_dev}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # === Database PostgreSQL ===
  db:
    image: postgres:16-alpine
    container_name: upa_tik_db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_DATABASE:-upa_tik_portal_dev}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === MinIO Object Storage ===
  minio:
    image: minio/minio:latest
    container_name: upa_tik_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === MinIO Setup (membuat bucket otomatis) ===
  minio-setup:
    image: minio/mc:latest
    container_name: upa_tik_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-upa-tik-uploads};
      mc anonymous set download local/$${MINIO_BUCKET:-upa-tik-uploads};
      echo 'Bucket setup selesai!';
      exit 0;
      "

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
